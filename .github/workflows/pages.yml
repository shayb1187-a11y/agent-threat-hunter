# Publishes the offline demo (`ath demo`) to GitHub Pages on every push to main.
#
# The site is rebuilt from the code on each push, so it cannot drift from what the
# repository does. It needs no model, key or external data: detection and
# investigations run on the shipped synthetic scenarios, and the recorded model runs
# are the curated static pages committed under docs/demo/recorded/.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Build the demo site
        run: ath demo --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
